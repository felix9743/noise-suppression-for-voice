name: Test Build

on:
  push:
    branches:
      - master
      - develop
      - ci-test
  pull_request:
    branches:
      - master

  workflow_dispatch:

# Building all the plugins doesn't add information but adds time,
# so build them only for manually launched builds.
env:
  full_build: ${{ (github.event_name == 'workflow_dispatch') && 1 || 0 }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "Windows",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            build_params: "--config Release",
            artifact_prefix: "Windows"
          }
          - {
            name: "Linux",
            os: ubuntu-latest,
            cc: "gcc", cxx: "g++",
            build_params: "",
            artifact_prefix: "Linux"
          }
          - {
            name: "macOS",
            os: macos-latest,
            cc: "clang", cxx: "clang++",
            build_params: "",
            artifact_prefix: "macOS",
          }

    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
              libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
              libxinerama-dev libxrandr-dev libxrender-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.cc }}
          variant: ccache
          max-size: 100M
          save: true 

      - name: Configure
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
          CMAKE_OSX_ARCHITECTURES: "x86_64;arm64"
        run: >-
          cmake -B${{runner.workspace}}/build -DCMAKE_BUILD_TYPE=Release 
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DBUILD_LADSPA_PLUGIN=1
          -DBUILD_VST_PLUGIN=1
          -DBUILD_VST3_PLUGIN=${{env.full_build}}
          -DBUILD_LV2_PLUGIN=${{env.full_build}}
          -DBUILD_AU_PLUGIN=${{env.full_build}}
          -DBUILD_AUV3_PLUGIN=${{env.full_build}}

      - name: Build
        run: |
          cmake --build ${{runner.workspace}}/build ${{matrix.config.build_params}} --parallel

      - name: Run tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        working-directory: ${{runner.workspace}}/build/src/common/
        run: ctest

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.config.artifact_prefix }}
          path: |
            ${{runner.workspace}}/build/bin
            !**/*.lib
            !**/*.pdb
            !**/*.exp
          retention-days: 1

  bundle:
    name: Create Final Bundle
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          pattern: build-*
          merge-multiple: false

      - name: Organize and Rename
        run: |
          mkdir release
          mv all-builds/build-Windows release/Windows
          mv all-builds/build-Linux release/Linux
          mv all-builds/build-macOS release/macOS

      - name: Upload Combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RNNoise-Plugins-Full-Package
          path: release/
          retention-days: 7
